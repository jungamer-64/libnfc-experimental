[package]
name = "proximate-native"
version = "0.2.0"
edition = "2024"
description = "Builtin drivers and native transport adapters for the experimental libnfc Rust core."
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
proximate-driver = { path = "../proximate-driver", default-features = false }
nusb = { version = "0.2", optional = true }
pcsc = { version = "2.9.0", optional = true }
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "event", "termios", "time"] }

[features]
default = [
    "driver-pn53x-usb",
    "driver-acr122-usb",
    "driver-acr122s",
    "driver-arygon",
    "driver-pn532-uart",
]
driver-pn53x-usb = ["dep:nusb"]
driver-acr122-usb = ["dep:nusb"]
driver-acr122s = []
driver-arygon = []
driver-pn532-uart = []
driver-pn532-spi = []
driver-pn532-i2c = []
driver-pcsc = ["dep:pcsc"]
driver-acr122-pcsc = ["dep:pcsc"]
driver-pn71xx = []
