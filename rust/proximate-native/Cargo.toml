[package]
name = "proximate-native"
version = "0.3.0"
edition = "2024"
description = "Builtin drivers and native transport adapters for the experimental libnfc Rust core."
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
proximate-driver = { path = "../proximate-driver", default-features = false }
pcsc = { version = "2.9.0", optional = true }
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "event", "pipe", "termios", "time"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nusb = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Communication",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[features]
default = [
    "driver-pn53x-usb",
    "driver-acr122-usb",
    "driver-acr122s",
    "driver-arygon",
    "driver-pn532-uart",
]
driver-pn53x-usb = ["dep:nusb"]
driver-acr122-usb = ["dep:nusb"]
driver-acr122s = []
driver-arygon = []
driver-pn532-uart = []
driver-pn532-spi = []
driver-pn532-i2c = []
driver-pcsc = ["dep:pcsc"]
driver-acr122-pcsc = ["dep:pcsc"]
driver-pn71xx = []
