name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_MANIFEST: rust/Cargo.toml

jobs:
  rust-green:
    name: Rust green path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-green-${{ hashFiles('rust/Cargo.lock', 'rust-toolchain.toml', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-green-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --manifest-path "$RUST_MANIFEST" --all -- --check

      - name: Check workspace
        run: cargo check --manifest-path "$RUST_MANIFEST" --workspace

      - name: Run clippy
        run: cargo clippy --manifest-path "$RUST_MANIFEST" --workspace -- -D warnings

      - name: Build documentation
        run: cargo doc --manifest-path "$RUST_MANIFEST" --workspace --no-deps

  rust-boundary-surface:
    name: Rust boundary surface (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit-tests
            os: windows-latest
            command: cargo test --manifest-path rust/Cargo.toml --workspace --lib
          - name: all-targets
            os: windows-latest
            command: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets
          - name: no-default-features
            os: windows-latest
            command: cargo check --manifest-path rust/Cargo.toml --workspace --no-default-features
          - name: all-features
            os: ubuntu-latest
            command: cargo check --manifest-path rust/Cargo.toml --workspace --all-features

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup show

      - name: Install Linux feature dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev pkg-config

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-boundary-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock', 'rust-toolchain.toml', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-boundary-
            ${{ runner.os }}-cargo-

      - name: Run required boundary command
        run: ${{ matrix.command }}

  rust-target-matrix:
    name: Rust target matrix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
            command: cargo check -p proximate-native --target x86_64-pc-windows-gnu --features driver-pcsc,driver-acr122-pcsc
          - name: freebsd-serial
            os: ubuntu-latest
            target: x86_64-unknown-freebsd
            command: cargo check -p proximate-native --target x86_64-unknown-freebsd --no-default-features --features driver-acr122s,driver-arygon,driver-pn532-uart
          - name: linux-pn71xx
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            command: cargo check -p proximate-native --target x86_64-unknown-linux-gnu --no-default-features --features driver-pn71xx

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-target-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock', 'rust-toolchain.toml', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-
            ${{ runner.os }}-cargo-

      - name: Check target configuration
        working-directory: rust
        env:
          RUSTFLAGS: -Dwarnings
        run: ${{ matrix.command }}

  rust-platform-rejection:
    name: Rust unsupported platform rejection (FreeBSD USB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-freebsd

      - name: Require explicit USB platform rejection
        working-directory: rust
        run: |
          if cargo check -p proximate-native --target x86_64-unknown-freebsd >cargo-output.log 2>&1; then
            echo "FreeBSD USB configuration unexpectedly succeeded"
            exit 1
          fi
          grep -F "USB drivers are supported only on Linux, macOS, and Windows" cargo-output.log

  script-hygiene:
    name: Script hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install script dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Check Rust FFI free ownership
        run: bash scripts/check_callerfree_usage.sh

  cmake-shared:
    name: CMake shared (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc
            os: ubuntu-latest
            generator: Ninja
            platform: ""
            cc: gcc
            cxx: g++
          - name: ubuntu-clang
            os: ubuntu-latest
            generator: Ninja
            platform: ""
            cc: clang
            cxx: clang++
          - name: macos-clang
            os: macos-latest
            generator: Ninja
            platform: ""
            cc: clang
            cxx: clang++
          - name: windows-msvc
            os: windows-latest
            generator: ""
            platform: x64
            cc: ""
            cxx: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-cmake-shared-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock', 'rust-toolchain.toml', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cmake-shared-
            ${{ runner.os }}-cargo-

      - name: Configure shared build
        env:
          CC_VALUE: ${{ matrix.cc }}
          CXX_VALUE: ${{ matrix.cxx }}
          CMAKE_GENERATOR_NAME: ${{ matrix.generator }}
          CMAKE_GENERATOR_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ -n "$CC_VALUE" ]; then
            export CC="$CC_VALUE"
          fi
          if [ -n "$CXX_VALUE" ]; then
            export CXX="$CXX_VALUE"
          fi

          cmake_args=(
            -S .
            -B build
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_EXAMPLES=ON
            -DBUILD_UTILS=ON
            -DBUILD_TESTING=ON
          )
          if [ -n "$CMAKE_GENERATOR_NAME" ]; then
            cmake_args+=(-G "$CMAKE_GENERATOR_NAME")
          fi
          if [ -n "$CMAKE_GENERATOR_PLATFORM" ]; then
            cmake_args+=(-A "$CMAKE_GENERATOR_PLATFORM")
          fi
          cmake "${cmake_args[@]}"

      - name: Build shared configuration
        run: cmake --build build --parallel --config Release

      - name: Run shared tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install shared build
        run: cmake --install build --prefix "$RUNNER_TEMP/libnfc-install-shared" --config Release

  cmake-package-smoke:
    name: CMake install package smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-cmake-package-${{ hashFiles('rust/Cargo.lock', 'rust-toolchain.toml', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cmake-package-
            ${{ runner.os }}-cargo-

      - name: Build and install shared package
        run: |
          cmake -S . -B build-package-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_UTILS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-package-shared --parallel
          ctest --test-dir build-package-shared --output-on-failure
          cmake --install build-package-shared --prefix "$RUNNER_TEMP/libnfc-install-shared"

      - name: Build and install static package
        run: |
          cmake -S . -B build-package-static -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_UTILS=OFF \
            -DBUILD_TESTING=ON
          cmake --build build-package-static --parallel
          ctest --test-dir build-package-static --output-on-failure
          cmake --install build-package-static --prefix "$RUNNER_TEMP/libnfc-install-static"

      - name: Verify pkg-config metadata
        run: |
          PKG_CONFIG_PATH="$RUNNER_TEMP/libnfc-install-shared/lib/pkgconfig" pkg-config --cflags --libs libnfc
          PKG_CONFIG_PATH="$RUNNER_TEMP/libnfc-install-static/lib/pkgconfig" pkg-config --static --libs libnfc

      - name: Verify installed CMake packages
        run: |
          create_consumer() {
            local source_dir="$1"
            local install_prefix="$2"

            mkdir -p "$source_dir"
            cat > "$source_dir/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.16)
          project(libnfc_consumer C)
          find_package(LibNFC CONFIG REQUIRED PATHS "$install_prefix/lib/cmake/LibNFC" NO_DEFAULT_PATH)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE LibNFC::nfc)
          EOF

            cat > "$source_dir/main.c" <<'EOF'
          #include <nfc/nfc.h>
          int main(void) { return nfc_version() == 0; }
          EOF

            cmake -S "$source_dir" -B "$source_dir/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build "$source_dir/build" --parallel
          }

          create_consumer "$RUNNER_TEMP/libnfc-consumer-shared" "$RUNNER_TEMP/libnfc-install-shared"
          create_consumer "$RUNNER_TEMP/libnfc-consumer-static" "$RUNNER_TEMP/libnfc-install-static"

  cmake-windows-product:
    name: Windows MSVC product and package
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build, test, and install shared product
        run: |
          cmake -S . -B build-windows-shared -A x64 \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_UTILS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-windows-shared --parallel --config Release
          ctest --test-dir build-windows-shared --output-on-failure -C Release
          cmake --install build-windows-shared --prefix "$RUNNER_TEMP/libnfc-windows-shared" --config Release
          cpack --config build-windows-shared/CPackConfig.cmake -C Release -G ZIP

      - name: Build, test, and install static product
        run: |
          cmake -S . -B build-windows-static -A x64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_UTILS=OFF \
            -DBUILD_TESTING=ON
          cmake --build build-windows-static --parallel --config Release
          ctest --test-dir build-windows-static --output-on-failure -C Release
          cmake --install build-windows-static --prefix "$RUNNER_TEMP/libnfc-windows-static" --config Release

      - name: Verify installed CMake consumers
        run: |
          create_consumer() {
            local source_dir
            local source_dir_cmake
            local install_prefix
            local install_prefix_cmake
            local linkage="$3"
            source_dir="$(cygpath -u "$1")"
            source_dir_cmake="$(cygpath -m "$1")"
            install_prefix="$(cygpath -u "$2")"
            install_prefix_cmake="$(cygpath -m "$2")"
            mkdir -p "$source_dir"
            cat > "$source_dir/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.16)
          project(libnfc_windows_consumer C)
          find_package(LibNFC CONFIG REQUIRED PATHS "$install_prefix_cmake/lib/cmake/LibNFC" NO_DEFAULT_PATH)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE LibNFC::nfc)
          EOF
            cat > "$source_dir/main.c" <<'EOF'
          #include <nfc/nfc.h>
          int main(void) { return nfc_version() == 0; }
          EOF
            cmake -S "$source_dir_cmake" -B "$source_dir_cmake/build" -A x64
            cmake --build "$source_dir_cmake/build" --parallel --config Release
            if [ "$linkage" = shared ]; then
              PATH="$install_prefix/bin:$PATH" "$source_dir/build/Release/consumer.exe"
            else
              "$source_dir/build/Release/consumer.exe"
            fi
          }
          create_consumer "$RUNNER_TEMP/libnfc-windows-consumer-shared" "$RUNNER_TEMP/libnfc-windows-shared" shared
          create_consumer "$RUNNER_TEMP/libnfc-windows-consumer-static" "$RUNNER_TEMP/libnfc-windows-static" static

  cmake-windows-mingw:
    name: Windows MinGW product and consumer
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust GNU target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW build environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: Build, test, install, and consume MinGW product
        shell: msys2 {0}
        run: |
          cmake -S . -B build-windows-mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_UTILS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-windows-mingw --parallel
          ctest --test-dir build-windows-mingw --output-on-failure
          install_prefix="$(cygpath -u "$RUNNER_TEMP")/libnfc-windows-mingw"
          cmake --install build-windows-mingw --prefix "$install_prefix"

          consumer_source="$(cygpath -u "$RUNNER_TEMP")/libnfc-mingw-consumer"
          mkdir -p "$consumer_source"
          cat > "$consumer_source/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.16)
          project(libnfc_mingw_consumer C)
          find_package(LibNFC CONFIG REQUIRED PATHS "$install_prefix/lib/cmake/LibNFC" NO_DEFAULT_PATH)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE LibNFC::nfc)
          EOF
          cat > "$consumer_source/main.c" <<'EOF'
          #include <nfc/nfc.h>
          int main(void) { return nfc_version() == 0; }
          EOF
          cmake -S "$consumer_source" -B "$consumer_source/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$consumer_source/build" --parallel
          PATH="$install_prefix/bin:$PATH" "$consumer_source/build/consumer.exe"
